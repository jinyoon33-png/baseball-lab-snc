<!-- 7-day schedule list — used in S3 결과·스케줄 right column.
     Classes: .week-list · .week-row · .week-row.today · .week-date · .week-content
              .week-meta · .week-items · .week-item.{primary|accent|muted} · .now-dot -->

<div class="week-list">
  <!-- Today (Day 1) — highlighted row -->
  <div class="week-row today">
    <div class="week-date">
      Day 1
      <strong>월</strong>
    </div>
    <div class="week-content">
      <h4>출력 · 파워</h4>
      <div class="week-meta">
        <span>고강도</span>
        <span>·</span>
        <span>5개 운동</span>
        <span>·</span>
        <span class="now-dot">오늘 진행 중</span>
      </div>
      <div class="week-items">
        <span class="week-item primary"><span class="marker"></span>박스 점프 3×5</span>
        <span class="week-item primary"><span class="marker"></span>메디신볼 슬램 3×8</span>
        <span class="week-item"><span class="marker"></span>스쿼트 4×5 @75%</span>
        <span class="week-item"><span class="marker"></span>푸시 프레스 3×5</span>
        <span class="week-item"><span class="marker"></span>코어 안티-로테이션 3×8</span>
      </div>
    </div>
  </div>

  <!-- Day 2 — recovery -->
  <div class="week-row">
    <div class="week-date">
      Day 2
      <strong>화</strong>
    </div>
    <div class="week-content">
      <h4>회복 · 가동성</h4>
      <div class="week-meta">
        <span>저강도</span>
        <span>·</span>
        <span>4개 운동</span>
      </div>
      <div class="week-items">
        <span class="week-item muted"><span class="marker"></span>어깨 가동성 루틴 10분</span>
        <span class="week-item muted"><span class="marker"></span>90/90 호흡 3×8</span>
        <span class="week-item muted"><span class="marker"></span>T-스파인 회전 3×8</span>
        <span class="week-item muted"><span class="marker"></span>장요근 스트레치</span>
      </div>
    </div>
  </div>

  <!-- Day 7 — rest -->
  <div class="week-row">
    <div class="week-date">
      Day 7
      <strong>일</strong>
    </div>
    <div class="week-content">
      <h4>휴식</h4>
      <div class="week-meta">
        <span>휴식</span>
        <span>·</span>
        <span>1개 운동</span>
      </div>
      <div class="week-items">
        <span class="week-item muted"><span class="marker"></span>능동 회복 + 폼롤러 15분</span>
      </div>
    </div>
  </div>
</div>
