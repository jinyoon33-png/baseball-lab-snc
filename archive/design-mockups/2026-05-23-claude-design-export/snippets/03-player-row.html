<!-- Player row — used in S1 roster
     Classes: .player-row .player-main .player-num .player-avatar
              .player-name-row .player-name .player-tag .player-meta
              .player-actions -->

<div class="player-row">
  <div class="player-main">
    <span class="player-num">01</span>
    <div class="player-avatar">KDH</div>
    <div>
      <div class="player-name-row">
        <span class="player-name">김도현</span>
        <span class="player-tag">투수 · 선발 · 16세</span>
      </div>
      <div class="player-meta">
        <span>구력 <span class="num">7년</span></span>
        <span>ACWR <span class="num">1.12</span></span>
        <span>주차 <span class="num">3/4</span></span>
        <span>구속 <span class="num">138/132</span></span>
      </div>
    </div>
  </div>
  <div class="player-actions">
    <span class="badge safe"><span class="dot"></span>정상</span>
    <button class="btn btn-sm btn-outline">컨디션</button>
    <button class="btn btn-sm btn-primary">결과 →</button>
  </div>
</div>
